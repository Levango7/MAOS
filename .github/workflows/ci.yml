# ─────────────────────────────────────────────────────────────────────
# MAOS (maop-enterprise) — CI Pipeline
#
# Tests the enterprise extension package against the MAOP main package.
# Python 3.10–3.13 matrix (3.14 excluded due to pyyaml 6.0.2 compat).
#
# 依赖说明：
#   - MAOP 基础包（maop-orchestrator）未发布到 PyPI，需从 Levango7/MAOP
#     仓库检出后 editable 安装。该仓库为私有仓库，需在 Settings → Secrets
#     配置 MAOP_ACCESS_TOKEN（具备 MAOP 仓库读取权限的 PAT）。
#   - 测试签名密钥被 gitignore，CI 中用 ci_generate_test_key.py 动态生成
#     临时密钥对（覆盖打包公钥），再签发测试 license。
# ─────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel superseded runs to save runner time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default token.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Checkout MAOP base package
        uses: actions/checkout@v4
        with:
          repository: Levango7/MAOP
          path: maop-base
          # 私有仓库需要 PAT secret（Settings → Secrets → MAOP_ACCESS_TOKEN）
          token: ${{ secrets.MAOP_ACCESS_TOKEN }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # MAOP 基础包不在 PyPI，先 editable 安装（满足 maop-orchestrator>=5.1.0）
          pip install -e maop-base/py
          # Install maop-enterprise in editable mode (pulls in dev deps).
          pip install -e ".[dev]"

      - name: Generate ephemeral test signing key
        run: |
          python scripts/ci_generate_test_key.py

      - name: Issue test license
        run: |
          python scripts/issue_test_license.py --write --customer "Test Enterprise" --days 365
          # 将签发的 license 导出给后续步骤（替代不存在的 MAOP_TEST_LICENSE_KEY secret）
          echo "MAOP_CI_LICENSE_KEY=$(cat data/test_license.key)" >> "$GITHUB_ENV"

      - name: Sign enterprise modules (integrity manifest)
        run: |
          # P0 #7: 用临时测试密钥生成完整性 manifest（测试仍设
          # MAOP_SKIP_INTEGRITY=1 隔离 license 与代码签名两类验证）
          python scripts/sign_enterprise_modules.py --key scripts/test_signing_key.pem

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short
        env:
          MAOP_SKIP_INTEGRITY: "1"
          MAOP_ENV: "test"
          MAOP_LICENSE_KEY: ${{ env.MAOP_CI_LICENSE_KEY }}

      - name: Lint
        run: |
          ruff check maop/ tests/

  # ── Coverage gate ────────────────────────────────────────────────
  # TODO: 当前实测覆盖率约 34%，门禁暂设 35%；随测试补全逐步提升至 70%。
  coverage:
    name: Coverage (≥35%)
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Checkout MAOP base package
        uses: actions/checkout@v4
        with:
          repository: Levango7/MAOP
          path: maop-base
          token: ${{ secrets.MAOP_ACCESS_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e maop-base/py
          pip install -e ".[dev]"
          pip install pytest-cov

      - name: Generate ephemeral test signing key
        run: |
          python scripts/ci_generate_test_key.py

      - name: Issue test license
        run: |
          python scripts/issue_test_license.py --write --customer "Test Enterprise" --days 365
          echo "MAOP_CI_LICENSE_KEY=$(cat data/test_license.key)" >> "$GITHUB_ENV"

      - name: Sign enterprise modules (integrity manifest)
        run: |
          python scripts/sign_enterprise_modules.py --key scripts/test_signing_key.pem

      - name: Run tests with coverage
        run: |
          pytest tests/ --cov=maop.enterprise --cov-report=term-missing --cov-fail-under=35
        env:
          MAOP_SKIP_INTEGRITY: "1"
          MAOP_ENV: "test"
          MAOP_LICENSE_KEY: ${{ env.MAOP_CI_LICENSE_KEY }}
