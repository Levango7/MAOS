[project]
name = "maop-enterprise"
version = "5.1.0"
description = "MAOP Enterprise Extension — RBAC, multi-tenant, SSO, audit, HA, and cloud backends"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Commercial"}
dependencies = [
    "maop>=5.1.0,<6.0.0",
]

[project.optional-dependencies]
postgresql = [
    "psycopg[binary]>=3.1",
    "asyncpg>=0.29",
]
redis = [
    "redis[hiredis]>=5.0",
]
rabbitmq = [
    "aio-pika>=9.0", "pika>=1.3.0",
]
vault = [
    "hvac>=2.0",
]
etcd = [
    "etcd3>=0.12",
]
sso-saml = [
    "python3-saml>=1.14",
]
sso-oidc = [
    "authlib>=1.3",
]
all = [
    "maop-enterprise[postgresql,redis,rabbitmq,vault,etcd,sso-oidc]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maop"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["E402", "BLE001", "S110"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true