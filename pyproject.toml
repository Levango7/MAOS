[project]
name = "maop-enterprise"
version = "5.2.1"
description = "MAOP Enterprise Extension — RBAC, multi-tenant, SSO, audit, HA, and cloud backends"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Commercial"}
dependencies = [
    # MAOP 基础包 PyPI 名（2026-08 由 maop 改为 maop-orchestrator，见 MAOP b64e418）
    "maop-orchestrator>=5.1.0,<6.0.0",
    # license 签名验证 / SSO store 加密 / TLS 自动化均依赖 cryptography（核心路径）
    "cryptography>=42.0",
    # n8n 集成模块级导入
    "httpx>=0.27",
]

[project.optional-dependencies]
postgresql = [
    "psycopg[binary]>=3.1",
    "asyncpg>=0.29",
]
redis = [
    "redis[hiredis]>=5.0",
]
rabbitmq = [
    "aio-pika>=9.0", "pika>=1.3.0",
]
vault = [
    "hvac>=2.0",
]
etcd = [
    "etcd3>=0.12",
]
sso-saml = [
    # SAML 2.0 自研实现（saml_handler.py）实际使用 lxml + defusedxml
    "lxml>=5.0",
    "defusedxml>=0.7",
]
sso-oidc = [
    "authlib>=1.3",
]
all = [
    "maop-enterprise[postgresql,redis,rabbitmq,vault,etcd,sso-saml,sso-oidc]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maop"]

# 完整性 manifest 虽在 .gitignore（发布流程产物），但必须打进 wheel：
# 生产环境 strict 模式依赖它做启动校验，缺失即阻断启动。
# 发布前必须用与打包 public_key.pem 配对的私钥重新签名（见
# scripts/sign_enterprise_modules.py 与 CHANGELOG P0 #7）。
[tool.hatch.build.targets.wheel.force-include]
"maop/enterprise/_integrity_manifest.json" = "maop/enterprise/_integrity_manifest.json"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["E402", "BLE001", "S110"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true